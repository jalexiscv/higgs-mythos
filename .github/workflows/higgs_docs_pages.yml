name: HIGGS Docs Pages

# Builds the Spanish documentation site in documentacion/ with MkDocs and
# deploys it to GitHub Pages. The reference pages (modules, configuration
# options and examples) are regenerated from the source tree first, so the
# published site always reflects the current code.

on:
  push:
    branches:
      - main
    paths:
      - documentacion/**
      - modules/**
      - examples/**
      - extras/SBOM/**
      - .github/workflows/higgs_docs_pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: documentacion/requirements.txt

      - name: Install MkDocs
        run: pip install -r documentacion/requirements.txt

      - name: Regenerate the reference pages
        run: python3 documentacion/scripts/generar_referencia.py

      - name: Build the site
        run: mkdocs build --strict -f documentacion/mkdocs.yml -d "${{ runner.temp }}/site"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
