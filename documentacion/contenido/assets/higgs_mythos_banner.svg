<text x="507" y="204.5" font-size="11.5" fill="#b4b4b4" xml:space="preserve">  audio_basics, audio_devices, audio_formats, audio_utils</text>
<text x="507" y="220.0" font-size="11.5" fill="#b4b4b4" xml:space="preserve">  audio_processors, audio_processors_headless, audio_plugin_client</text>
<text x="507" y="235.5" font-size="11.5" fill="#b4b4b4" xml:space="preserve">  dsp, midi_ci, osc, javascript, box2d, analytics, product_unlocking</text>
<text x="507" y="266.5" font-size="11.5" fill="#e2e2e2" xml:space="preserve">Herramientas</text>
