<text x="507" y="80.5" font-size="11.5" fill="#b4b4b4" xml:space="preserve">  macOS · Windows · Linux · iOS · Android</text>
<text x="507" y="111.5" font-size="11.5" fill="#e2e2e2" xml:space="preserve">Plug-ins de audio</text>
<text x="507" y="127.0" font-size="11.5" fill="#b4b4b4" xml:space="preserve">  VST · VST3 · AU · AUv3 · AAX · LV2 · Standalone · hosts</text>
